name: Bug report
description: Report incorrect behavior, a regression, crash, or performance issue.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Infergo. Do not include secrets, private models, or security vulnerabilities in this form.

  - type: input
    id: version
    attributes:
      label: Infergo version
      description: Provide a release tag or commit SHA.
      placeholder: v0.1.0 or 4ff970e
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.27.1
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Include operating system, architecture, and C compiler.
      placeholder: Linux amd64, GCC 15
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: ONNX Runtime
      description: Include the loaded version, provider, and whether the runtime is bundled or custom.
      placeholder: 1.29.0 bundled CPU runtime
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Explain what happened and what should have happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete program, test, or repository that demonstrates the problem.
      render: go
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or benchmark output
      description: Include complete errors, race reports, profiles, or before/after benchmark results when relevant.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and release notes.
          required: true
        - label: I can reproduce this with the latest version.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
