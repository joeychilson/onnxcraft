name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.13

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Check modules
        run: |
          go mod tidy -diff
          go mod verify
      - name: Test
        run: go test -race -shuffle=on ./...
      - name: Build
        run: go build ./...
      - name: Compile benchmarks
        run: go test -run '^$' -bench=. -benchtime=1x ./...

  integration:
    name: Integration (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            command: go test -race -count=1 -shuffle=on ./...
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            command: go test -race -count=1 -shuffle=on ./...
          - platform: darwin-arm64
            runner: macos-15
            command: go test -race -count=1 -shuffle=on ./...
          - platform: windows-amd64
            runner: windows-2025
            command: go test -race -count=1 -shuffle=on ./...
          - platform: windows-arm64
            runner: windows-11-arm
            command: go test -count=1 -shuffle=on ./...
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      INFERGO_CACHE_DIR: ${{ github.workspace }}/.cache/infergo
      GOEXPERIMENT: cgocheck2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.INFERGO_CACHE_DIR }}
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.go', 'runtime_assets.go') }}
      - name: Select native Windows ARM64 compiler
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          clang --version
          "CC=clang" >> $env:GITHUB_ENV
      - name: Test with native runtime
        env:
          INFERGO_INTEGRATION: "1"
        run: ${{ matrix.command }}

  address-sanitizer:
    name: Address sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Go's cgo loader retains process-lifetime bookkeeping that LeakSanitizer
      # cannot attribute. ASan's bounds and use-after-free checks remain active.
      ASAN_OPTIONS: detect_leaks=0
      INFERGO_CACHE_DIR: ${{ github.workspace }}/.cache/infergo
      INFERGO_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.INFERGO_CACHE_DIR }}
          key: onnxruntime-asan-${{ hashFiles('runtime.go', 'runtime_assets.go') }}
      - name: Test native boundary
        run: go test -asan -count=1 -shuffle=on ./...

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.27.1"
          go-package: ./...
