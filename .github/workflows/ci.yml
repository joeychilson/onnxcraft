name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check modules
        run: |
          go mod tidy -diff
          go mod verify
      - name: Test
        run: go test -race -shuffle=on ./...
      - name: Build
        run: go build ./...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFERGO_CACHE_DIR: ${{ github.workspace }}/.cache/infergo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache ONNX Runtime
        uses: actions/cache@v6
        with:
          path: ${{ env.INFERGO_CACHE_DIR }}
          key: onnxruntime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.go', 'runtime_assets.go') }}
      - name: Test with native runtime
        env:
          INFERGO_INTEGRATION: "1"
        run: go test -race -count=1 -shuffle=on ./...

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
